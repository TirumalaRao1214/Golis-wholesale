<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <title>Daily Closing — GOLIS Wholesale</title>  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body>
  <div id="app-layout">
    <aside id="sidebar"></aside>
    <div id="main-content">
      <header id="topbar"></header>
      <div id="demo-banner"></div>
      <main class="page-content">
        <div class="page-header">
          <h1 class="page-title" data-i18n="page.dailyClosing"></h1>
          <div class="page-header-actions">
            <span id="closing-date-label" style="font-size:0.9rem;color:var(--color-text-secondary);font-weight:500;"></span>
          </div>
        </div>

        <!-- Day closed banner (hidden by default) -->
        <div id="day-closed-banner" style="display:none;" class="alert alert--success" style="margin-bottom:1rem;">
          ✅ Day has been closed. Final closing saved.
        </div>

        <!-- Today's Profit / Loss Hero Card -->
        <div class="card" style="margin-bottom:1.25rem;background:var(--color-primary);color:white;">
          <div class="card__body" style="display:flex;align-items:center;justify-content:space-between;padding:1.5rem;">
            <div>
              <div style="font-size:0.875rem;opacity:0.8;">Today's Net Profit / Loss</div>
              <div style="font-size:2.5rem;font-weight:800;" id="dc-hero-profit">—</div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:0.875rem;opacity:0.8;">Sales − Purchases − Expenses</div>
              <div id="dc-hero-formula" style="font-size:0.9rem;opacity:0.9;"></div>
            </div>
          </div>
        </div>

        <!-- Summary Sections Grid -->
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.25rem;margin-bottom:1.25rem;">
          <!-- Purchases -->
          <div class="card">
            <div class="card__header"><h3 class="card__title">1. Purchases</h3></div>
            <div class="card__body" id="dc-purchases"></div>
          </div>
          <!-- Sales -->
          <div class="card">
            <div class="card__header"><h3 class="card__title">2. Sales (Orders)</h3></div>
            <div class="card__body" id="dc-sales"></div>
          </div>
          <!-- Expenses -->
          <div class="card">
            <div class="card__header"><h3 class="card__title">3. Expenses</h3></div>
            <div class="card__body" id="dc-expenses"></div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.25rem;margin-bottom:1.25rem;">
          <!-- Inventory -->
          <div class="card">
            <div class="card__header"><h3 class="card__title">4. Inventory (Closing)</h3></div>
            <div class="card__body" id="dc-inventory"></div>
          </div>
          <!-- Payments -->
          <div class="card">
            <div class="card__header"><h3 class="card__title">5. Payments</h3></div>
            <div class="card__body" id="dc-payments"></div>
          </div>
          <!-- Labour -->
          <div class="card">
            <div class="card__header"><h3 class="card__title">6. Labour</h3></div>
            <div class="card__body" id="dc-labour"></div>
          </div>
        </div>

        <!-- Close Day Button -->
        <div id="close-day-panel" class="card">
          <div class="card__body" style="display:flex;align-items:center;justify-content:space-between;padding:1.25rem;">
            <div>
              <strong>Ready to close the day?</strong>
              <div style="font-size:0.875rem;color:var(--color-text-secondary);">This will save all today's data as a daily closing record.</div>
            </div>
            <button class="btn btn-primary btn-lg" id="close-day-btn" onclick="closeDay()" style="background:var(--color-success);border-color:var(--color-success);min-width:160px;">
              ✅ Close Day
            </button>
          </div>
        </div>
      </main>
    </div>
  </div>  <script src="../js/i18n.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/charts.js"></script>
  <script>
(function () {
'use strict';
    var CLOSING_KEY = 'golis_daily_closing_done';

    function loadDailyClosing() {
    var today = new Date().toISOString().split('T')[0];
      document.getElementById('closing-date-label').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    var purchases = MockDB.getPurchases().filter(p => p.date === today);
    var orders = MockDB.getOrders().filter(o => o.orderDate === today);
    var expenses = MockDB.getExpenses().filter(e => e.date === today);
    var payments = MockDB.getPayments().filter(p => p.date === today);
    var labour = MockDB.getLabour();
    var attendance = MockDB.getAttendance(today);
    var inventory = MockDB.getInventory();
    var vegs = MockDB.getVegetables();
    var totalPurchases = purchases.reduce((s, p) => s + p.total, 0);
    var totalSales = orders.reduce((s, o) => s + o.total, 0);
    var totalExpenses = expenses.reduce((s, e) => s + e.amount, 0);
    var netProfit = totalSales - totalPurchases - totalExpenses;

      // Hero profit
      document.getElementById('dc-hero-profit').textContent = Utils.formatCurrency(netProfit);
      document.getElementById('dc-hero-profit').style.color = netProfit >= 0 ? '#d1fae5' : '#fca5a5';
      document.getElementById('dc-hero-formula').textContent = `${Utils.formatCurrency(totalSales)} − ${Utils.formatCurrency(totalPurchases)} − ${Utils.formatCurrency(totalExpenses)}`;

      // Section 1: Purchases
      document.getElementById('dc-purchases').innerHTML = `
        <div class="summary-item"><span>Records</span><strong>${purchases.length}</strong></div>
        <div class="summary-item"><span>Total Value</span><strong class="text-warning">${Utils.formatCurrency(totalPurchases)}</strong></div>
        <div class="summary-item"><span>Pending</span><strong>${purchases.filter(p=>p.status==='pending').length}</strong></div>
      `;

      // Section 2: Sales
      document.getElementById('dc-sales').innerHTML = `
        <div class="summary-item"><span>Orders</span><strong>${orders.length}</strong></div>
        <div class="summary-item"><span>Total Value</span><strong class="text-success">${Utils.formatCurrency(totalSales)}</strong></div>
        <div class="summary-item"><span>Delivered</span><strong>${orders.filter(o=>o.status==='delivered').length}</strong></div>
      `;

      // Section 3: Expenses
    var byCategory = {};
      expenses.forEach(e => byCategory[e.category] = (byCategory[e.category] || 0) + e.amount);
      document.getElementById('dc-expenses').innerHTML =
        Object.entries(byCategory).map(([k, v]) => `<div class="summary-item"><span>${k}</span><strong>${Utils.formatCurrency(v)}</strong></div>`).join('') +
        `<div class="summary-item" style="border-top:1px solid var(--color-border);margin-top:0.5rem;padding-top:0.5rem;"><span>Total</span><strong class="text-danger">${Utils.formatCurrency(totalExpenses)}</strong></div>`;

      // Section 4: Inventory closing
    var topVegs = inventory.slice(0, 5);
      document.getElementById('dc-inventory').innerHTML = topVegs.map(inv => {
    var veg = vegs.find(v => v.id === inv.vegId);
    var closing = inv.opening + inv.purchased - inv.sold - inv.damaged - inv.wastage;
        return `<div class="summary-item"><span>${veg ? veg.nameEn : inv.vegId} (${inv.grade})</span><strong>${closing.toLocaleString('en-IN')} kg</strong></div>`;
      }).join('') + `<div class="summary-item text-muted"><small>+${inventory.length - 5} more items</small></div>`;

      // Section 5: Payments
    var farmerPayments = payments.filter(p => p.partyType === 'farmer').reduce((s,p)=>s+p.amount,0);
    var vendorPayments = payments.filter(p => p.partyType === 'vendor').reduce((s,p)=>s+p.amount,0);
      document.getElementById('dc-payments').innerHTML = `
        <div class="summary-item"><span>Farmer Payouts</span><strong class="text-warning">${Utils.formatCurrency(farmerPayments)}</strong></div>
        <div class="summary-item"><span>Vendor Receipts</span><strong class="text-success">${Utils.formatCurrency(vendorPayments)}</strong></div>
        <div class="summary-item"><span>Total Transactions</span><strong>${payments.length}</strong></div>
      `;

      // Section 6: Labour
    var present = attendance.filter(a => ['present','overtime'].includes(a.status)).length;
    var labourCost = attendance.filter(a => ['present','overtime'].includes(a.status)).reduce((s, a) => {
    var w = labour.find(l => l.id === a.labourId);
        return s + (w ? w.dailyWage : 0);
      }, 0);
      document.getElementById('dc-labour').innerHTML = `
        <div class="summary-item"><span>Workers Present</span><strong class="text-success">${present}</strong></div>
        <div class="summary-item"><span>Absent</span><strong class="text-danger">${attendance.filter(a=>a.status==='absent').length}</strong></div>
        <div class="summary-item"><span>Today's Wages</span><strong class="text-warning">${Utils.formatCurrency(labourCost)}</strong></div>
      `;

      // Check if already closed
    var closedDates = JSON.parse(localStorage.getItem(CLOSING_KEY) || '[]');
      if (closedDates.includes(today)) {
        document.getElementById('day-closed-banner').style.display = '';
        document.getElementById('close-day-btn').disabled = true;
        document.getElementById('close-day-btn').textContent = '✅ Day Already Closed';
        document.getElementById('close-day-btn').style.opacity = '0.5';
      }
    }

    function closeDay() {
      Utils.confirm('Are you sure you want to close today? This will save all daily records.', () => {
    var today = new Date().toISOString().split('T')[0];
    var closedDates = JSON.parse(localStorage.getItem(CLOSING_KEY) || '[]');
        if (!closedDates.includes(today)) closedDates.push(today);
        localStorage.setItem(CLOSING_KEY, JSON.stringify(closedDates));

        document.getElementById('day-closed-banner').style.display = '';
        document.getElementById('close-day-btn').disabled = true;
        document.getElementById('close-day-btn').textContent = '✅ Day Already Closed';
        document.getElementById('close-day-btn').style.opacity = '0.5';
        Utils.showToast('Day closed successfully. Records saved.', 'success');
      }, { confirmLabel: 'Close Day', cancelLabel: 'Cancel' });
    }

    document.addEventListener('DOMContentLoaded', () => {
      APP.init('owner');
      loadDailyClosing();
    });
}());
</script>
</body>
</html>
