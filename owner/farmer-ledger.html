<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <title>Farmer Ledger — GOLIS Wholesale</title>  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body>
  <div id="app-layout">
    <aside id="sidebar"></aside>
    <div id="main-content">
      <header id="topbar"></header>
      <div id="demo-banner"></div>
      <main class="page-content">
        <div class="page-header">
          <h1 class="page-title" data-i18n="page.farmerLedger"></h1>
          <div class="page-header-actions">
            <button class="btn btn-ghost" onclick="printLedger()">🖨 Print</button>
            <button class="btn btn-secondary" onclick="exportLedger()">⬇ Export CSV</button>
          </div>
        </div>

        <!-- Farmer Selector -->
        <div class="card" style="margin-bottom:1rem;">
          <div class="card__body">
            <div class="filter-row">
              <label class="form-label" style="white-space:nowrap;margin:0 0.5rem 0 0;">Select Farmer:</label>
              <select class="form-select" id="ledger-farmer-sel" onchange="loadFarmerLedger()">
                <option value="">— Select Farmer —</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Summary Strip -->
        <div id="farmer-ledger-summary" style="display:none;">
          <div class="stats-grid stats-grid--3" style="margin-bottom:1rem;">
            <div class="stat-card stat-card--info">
              <div class="stat-card__body">
                <div class="stat-card__value" id="fl-total-supply">—</div>
                <div class="stat-card__label">Total Supply Value</div>
              </div>
            </div>
            <div class="stat-card stat-card--success">
              <div class="stat-card__body">
                <div class="stat-card__value" id="fl-total-paid">—</div>
                <div class="stat-card__label">Total Paid</div>
              </div>
            </div>
            <div class="stat-card stat-card--warning">
              <div class="stat-card__body">
                <div class="stat-card__value" id="fl-balance">—</div>
                <div class="stat-card__label">Balance Payable</div>
              </div>
            </div>
          </div>

          <!-- Ledger Table -->
          <div class="card">
            <div class="card__header">
              <h3 class="card__title" id="fl-farmer-name">Ledger</h3>
            </div>
            <div class="card__body" style="padding:0;">
              <div class="table-responsive">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th data-i18n="col.date"></th>
                      <th data-i18n="col.description"></th>
                      <th data-i18n="common.debit"></th>
                      <th data-i18n="common.credit"></th>
                      <th data-i18n="common.balance"></th>
                      <th data-i18n="common.notes"></th>
                    </tr>
                  </thead>
                  <tbody id="farmer-ledger-tbody"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <div id="farmer-ledger-empty" class="empty-state-card">
          <div class="empty-state">Select a farmer above to view their ledger.</div>
        </div>
      </main>
    </div>
  </div>  <script src="../js/i18n.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/charts.js"></script>
  <script>
(function () {
'use strict';
    var _currentFarmerId = null;

    function loadFarmerLedger() {
    var farmerId = document.getElementById('ledger-farmer-sel').value;
      if (!farmerId) {
        document.getElementById('farmer-ledger-summary').style.display = 'none';
        document.getElementById('farmer-ledger-empty').style.display = '';
        return;
      }
      _currentFarmerId = farmerId;
    var farmer = MockDB.getFarmerById(farmerId);
    var entries = MockDB.getLedgerEntries(farmerId).sort((a, b) => a.date.localeCompare(b.date));
    var payments = MockDB.getPayments().filter(p => p.partyId === farmerId && p.partyType === 'farmer');
    var totalSupply = entries.filter(e => e.credit > 0).reduce((s, e) => s + e.credit, 0);
    var totalPaid = payments.reduce((s, p) => s + p.amount, 0);
    var balance = totalSupply - totalPaid;

      document.getElementById('fl-farmer-name').textContent = (farmer ? farmer.name : farmerId) + ' — Ledger';
      document.getElementById('fl-total-supply').textContent = Utils.formatCurrency(totalSupply);
      document.getElementById('fl-total-paid').textContent = Utils.formatCurrency(totalPaid);
      document.getElementById('fl-balance').textContent = Utils.formatCurrency(Math.max(0, balance));

      document.getElementById('farmer-ledger-tbody').innerHTML = entries.map(e => `
        <tr class="${e.credit > 0 ? 'row--credit' : 'row--debit'}">
          <td>${Utils.formatDate(e.date)}</td>
          <td>${e.description}</td>
          <td class="${e.debit > 0 ? 'text-warning font-bold' : 'text-muted'}">${e.debit > 0 ? Utils.formatCurrency(e.debit) : '—'}</td>
          <td class="${e.credit > 0 ? 'text-success font-bold' : 'text-muted'}">${e.credit > 0 ? Utils.formatCurrency(e.credit) : '—'}</td>
          <td><strong>${Utils.formatCurrency(e.balance)}</strong></td>
          <td class="text-muted"><small>${e.refId || ''}</small></td>
        </tr>
      `).join('') || '<tr><td colspan="6" class="empty-state" data-i18n="empty.ledger">No ledger entries</td></tr>';

      document.getElementById('farmer-ledger-summary').style.display = '';
      document.getElementById('farmer-ledger-empty').style.display = 'none';
    }

    function printLedger() {
      window.print();
    }

    function exportLedger() {
      if (!_currentFarmerId) { Utils.showToast('Please select a farmer first.', 'warning'); return; }
    var entries = MockDB.getLedgerEntries(_currentFarmerId);
    var data = entries.map(e => ({ Date: e.date, Description: e.description, Debit: e.debit, Credit: e.credit, Balance: e.balance }));
    var farmer = MockDB.getFarmerById(_currentFarmerId);
      Utils.exportCSV(data, `ledger-${farmer ? farmer.name.replace(/\s/g,'-') : _currentFarmerId}.csv`);
    }

    document.addEventListener('DOMContentLoaded', () => {
      APP.init('owner');
    var farmers = MockDB.getFarmers();
    var sel = document.getElementById('ledger-farmer-sel');
      farmers.forEach(f => sel.add(new Option(f.name + ' (' + f.id + ')', f.id)));

      // Check URL param
    var params = new URLSearchParams(window.location.search);
    var id = params.get('id');
      if (id) {
        sel.value = id;
        loadFarmerLedger();
      }
    });
}());
</script>
</body>
</html>
