<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Statement — GOLIS Wholesale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body>
  <div id="app-layout">
    <aside id="sidebar"></aside>
    <div id="main-content">
      <header id="topbar"></header>
      <div id="demo-banner"></div>
      <main class="page-content">
        <div class="page-header">
          <h1 class="page-title">Account Statement</h1>
          <div class="page-header-actions">
            <button class="btn btn-secondary" onclick="exportCSV()">⬇ Export CSV</button>
          </div>
        </div>

        <!-- Summary -->
        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
          <div class="stat-card stat-card--info">
            <div class="stat-card__icon">📦</div>
            <div class="stat-card__body">
              <div class="stat-card__value" id="kpi-total-purchases">—</div>
              <div class="stat-card__label">Total Purchases</div>
            </div>
          </div>
          <div class="stat-card stat-card--success">
            <div class="stat-card__icon">✅</div>
            <div class="stat-card__body">
              <div class="stat-card__value" id="kpi-total-paid">—</div>
              <div class="stat-card__label">Total Paid</div>
            </div>
          </div>
          <div class="stat-card stat-card--danger">
            <div class="stat-card__icon">⏳</div>
            <div class="stat-card__body">
              <div class="stat-card__value" id="kpi-outstanding">—</div>
              <div class="stat-card__label">Outstanding</div>
            </div>
          </div>
        </div>

        <!-- Date Filter -->
        <div class="card" style="margin-top:1.25rem;">
          <div class="card__body">
            <div style="display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap;">
              <div class="form-group" style="margin:0;">
                <label class="form-label">From Date</label>
                <input type="date" class="form-input" id="filter-from">
              </div>
              <div class="form-group" style="margin:0;">
                <label class="form-label">To Date</label>
                <input type="date" class="form-input" id="filter-to">
              </div>
              <button class="btn btn-secondary" onclick="applyFilter()">Apply</button>
              <button class="btn btn-ghost" onclick="clearFilter()">Clear</button>
            </div>
          </div>
        </div>

        <!-- Ledger Table -->
        <div class="card" style="margin-top:1.25rem;">
          <div class="card__header">
            <h3 class="card__title">📒 Account Ledger</h3>
            <span class="badge badge--info" id="entry-count">0 entries</span>
          </div>
          <div class="card__body" style="padding:0;">
            <table class="table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Description</th>
                  <th class="text-right" style="color:var(--color-warning);">Debit (Payment Made)</th>
                  <th class="text-right" style="color:var(--color-danger);">Credit (Order Value)</th>
                  <th class="text-right">Balance</th>
                </tr>
              </thead>
              <tbody id="ledger-tbody">
                <tr><td colspan="5" class="text-center text-muted">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/charts.js"></script>
  <script>
    let allEntries = [];

    document.addEventListener('DOMContentLoaded', () => {
      APP.init('vendor');
      const vendorId = APP.user.refId;

      allEntries = MockDB.getLedgerEntries(vendorId);
      allEntries.sort((a, b) => a.date.localeCompare(b.date));

      // Compute running balance (vendor: credit = order value owed, debit = payment made by vendor)
      let runningBalance = 0;
      allEntries = allEntries.map(e => {
        // For vendors: credit increases their debt, debit reduces it
        runningBalance += (e.debit - e.credit);
        return { ...e, runningBalance };
      });

      const totalCredit = allEntries.reduce((s, e) => s + e.debit, 0);   // order invoiced (what they owe)
      const totalDebit  = allEntries.reduce((s, e) => s + e.credit, 0);  // payments received by golis

      document.getElementById('kpi-total-purchases').textContent = Utils.formatCurrency(totalCredit);
      document.getElementById('kpi-total-paid').textContent      = Utils.formatCurrency(totalDebit);
      document.getElementById('kpi-outstanding').textContent     = Utils.formatCurrency(Math.max(0, totalCredit - totalDebit));

      renderTable(allEntries);
    });

    function renderTable(data) {
      document.getElementById('entry-count').textContent = data.length + ' entries';
      const tbody = document.getElementById('ledger-tbody');
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No ledger entries found</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(e => {
        const isOrder   = e.debit > 0;
        const rowStyle  = isOrder ? 'background:#fff5f5;' : 'background:#f0fdf4;';
        return `<tr style="${rowStyle}">
          <td>${Utils.formatDate(e.date)}</td>
          <td>${e.description}</td>
          <td class="text-right" style="font-weight:600;color:var(--color-warning);">${e.credit > 0 ? Utils.formatCurrency(e.credit) : '—'}</td>
          <td class="text-right" style="font-weight:600;color:var(--color-danger);">${e.debit > 0 ? Utils.formatCurrency(e.debit) : '—'}</td>
          <td class="text-right" style="font-weight:700;color:${e.runningBalance > 0 ? 'var(--color-danger)' : 'var(--color-success)'};">${Utils.formatCurrency(Math.abs(e.runningBalance))} ${e.runningBalance > 0 ? 'Due' : 'Credit'}</td>
        </tr>`;
      }).join('');
    }

    function applyFilter() {
      const from = document.getElementById('filter-from').value;
      const to   = document.getElementById('filter-to').value;
      let filtered = [...allEntries];
      if (from) filtered = filtered.filter(e => e.date >= from);
      if (to)   filtered = filtered.filter(e => e.date <= to);
      renderTable(filtered);
    }

    function clearFilter() {
      document.getElementById('filter-from').value = '';
      document.getElementById('filter-to').value   = '';
      renderTable(allEntries);
    }

    function exportCSV() {
      const headers = ['Date','Description','Payment Made','Order Value','Balance'];
      const rows = allEntries.map(e => [e.date, `"${e.description}"`, e.credit, e.debit, e.runningBalance]);
      const csv  = [headers, ...rows].map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type:'text/csv' });
      const a    = document.createElement('a');
      a.href     = URL.createObjectURL(blob);
      a.download = `golis_vendor_ledger_${APP.user.refId}.csv`;
      a.click();
      Utils.showToast('Statement exported to CSV', 'success');
    }
  </script>
</body>
</html>
